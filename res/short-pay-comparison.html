@font-face{font-family:"Martina Plantijn";src:url("../fonts/martina-plantijn-light.woff2") format("woff2");font-weight:300;font-style:normal;font-display:swap}
/* Tally UI tokens (light first, then dark) */
:root{
  --bg-page:#f8f7f6;--bg-primary:#ffffff;--bg-secondary:#f8f7f6;--bg-tertiary:#f2f1f0;--bg-quaternary:#e9e8e7;
  --text-primary:#181716;--text-secondary:#64615c;--text-tertiary:#827f7a;
  --border-primary:#e1dfdd;--border-secondary:#e9e8e7;
  --brand:#1967d4;--brand-hover:#1451a6;--brand-soft:#f3f8ff;--brand-text:#1967d4;--focus-ring:#b2d2ff;
  --disp:#8641c7;--disp-soft:#f1e5fb;--disp-text:#5a2789;
  --good:#5ba31f;--good-soft:#edf9df;--good-text:#4f7b16;
  --warn:#f9cc32;--warn-soft:#fff4d4;--warn-text:#a8871b;
  --lost:#e15252;--lost-soft:#ffe6e6;--lost-text:#c83b3b;--lost-hatch:#f89898;
  --acc:#c3beb8;
  /* Tally Badge: fill = utility -200, text = darkest step, dot/icon = -500 */
  --b-gray-bg:#f2f1f0;--b-gray-tx:#181716;--b-gray-dot:#c3beb8;
  --b-brand-bg:#b7d0f6;--b-brand-tx:#061933;--b-brand-dot:#1967d4;
  --b-success-bg:#cdeea4;--b-success-tx:#1f3009;--b-success-dot:#74c42e;
  --b-warning-bg:#fee793;--b-warning-tx:#3a3118;--b-warning-dot:#f9cc32;
  --b-error-bg:#ffc1c1;--b-error-tx:#49010d;--b-error-dot:#e15252;
  --b-purple-bg:#e3cbf7;--b-purple-tx:#2a1340;--b-purple-dot:#8641c7;
  --font-body:"Saans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-display:"Martina Plantijn",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg-page:#181716;--bg-primary:#181716;--bg-secondary:#45433f;--bg-tertiary:#64615c;--bg-quaternary:#827f7a;
  --text-primary:#fcfcfb;--text-secondary:#e9e8e7;--text-tertiary:#e1dfdd;
  --border-primary:#827f7a;--border-secondary:#64615c;
  --brand:#1967d4;--brand-hover:#1967d4;--brand-soft:#061933;--brand-text:#85b2ef;--focus-ring:#b7d0f6;
  --disp:#ae76dc;--disp-soft:#2a1340;--disp-text:#d0aaf1;
  --b-gray-bg:#827f7a;--b-gray-tx:#fcfcfb;--b-brand-bg:#10346a;--b-brand-tx:#f3f8ff;--b-success-bg:#345a14;--b-success-tx:#dff3c3;
  --b-warning-bg:#a8871b;--b-warning-tx:#fef0b8;--b-error-bg:#851d29;--b-error-tx:#ffdede;--b-purple-bg:#461d6a;--b-purple-tx:#f1e5fb;
  --good:#74c42e;--good-soft:#1f3009;--good-text:#b5e579;
  --warn:#f9cc32;--warn-soft:#3a3118;--warn-text:#fddc6e;
  --lost:#ef7070;--lost-soft:#49010d;--lost-text:#f89898;--lost-hatch:#851d29;--acc:#64615c;}}
:root[data-theme="dark"]{
  --bg-page:#181716;--bg-primary:#181716;--bg-secondary:#45433f;--bg-tertiary:#64615c;--bg-quaternary:#827f7a;
  --text-primary:#fcfcfb;--text-secondary:#e9e8e7;--text-tertiary:#e1dfdd;
  --border-primary:#827f7a;--border-secondary:#64615c;
  --brand:#1967d4;--brand-hover:#1967d4;--brand-soft:#061933;--brand-text:#85b2ef;--focus-ring:#b7d0f6;
  --disp:#ae76dc;--disp-soft:#2a1340;--disp-text:#d0aaf1;
  --b-gray-bg:#827f7a;--b-gray-tx:#fcfcfb;--b-brand-bg:#10346a;--b-brand-tx:#f3f8ff;--b-success-bg:#345a14;--b-success-tx:#dff3c3;
  --b-warning-bg:#a8871b;--b-warning-tx:#fef0b8;--b-error-bg:#851d29;--b-error-tx:#ffdede;--b-purple-bg:#461d6a;--b-purple-tx:#f1e5fb;
  --good:#74c42e;--good-soft:#1f3009;--good-text:#b5e579;

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-body);
  font-variant-numeric:tabular-nums;font-variant-ligatures:no-contextual;font-feature-settings:"calt" 0;text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased}
.page{max-width:1200px;margin:24px auto;padding:0 16px}
svg.i{width:12px;height:12px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Badges (Tally Badge: modern + pill-color) */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:16px;font-weight:450;padding:2px 6px;border-radius:6px;white-space:nowrap}
.badge>span{padding:0 2px}
.badge.modern{background:var(--bg-primary);color:var(--text-primary);box-shadow:inset 0 0 0 1px var(--border-primary)}
.badge.pill{border-radius:9999px;padding:2px 8px 2px 6px}
.badge.pill::before{content:"";width:6px;height:6px;border-radius:9999px;background:var(--dot,currentColor);flex:none}
.badge.pill.noDot::before{display:none}
.tone-gray{background:var(--b-gray-bg);color:var(--b-gray-tx);--dot:var(--b-gray-dot)}
.tone-brand{background:var(--b-brand-bg);color:var(--b-brand-tx);--dot:var(--b-brand-dot)}
.tone-success{background:var(--b-success-bg);color:var(--b-success-tx);--dot:var(--b-success-dot)}
.tone-warning{background:var(--b-warning-bg);color:var(--b-warning-tx);--dot:var(--b-warning-dot)}
.tone-error{background:var(--b-error-bg);color:var(--b-error-tx);--dot:var(--b-error-dot)}
.tone-dispute{background:var(--b-purple-bg);color:var(--b-purple-tx);--dot:var(--b-purple-dot)}

.ff{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:450;color:var(--text-secondary);background:var(--bg-primary);box-shadow:inset 0 0 0 1px var(--border-primary);border-radius:9999px;padding:4px 10px 4px 8px;opacity:0;transition:opacity .2s linear;white-space:nowrap}
.ff.on{opacity:1}
.ff svg{display:block;animation:pulse 1.4s linear infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.port .ff{position:absolute;right:0;top:12px}

/* Controls (Tally Button / ButtonGroup) */
.controls{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;flex-wrap:wrap}
.controls button{font:inherit;font-weight:400;height:32px;padding:0 10px;border:0;background:var(--bg-primary);color:var(--text-secondary);
  box-shadow:inset 0 0 0 1px var(--border-primary),0 1px 3px rgba(24,23,22,.05);border-radius:8px;cursor:pointer;transition:background .1s linear}
.controls button:hover{background:var(--bg-secondary)}
.controls button.primary{background:var(--brand);color:#fff;box-shadow:0 1px 3px rgba(24,23,22,.05)}
.controls button.primary:hover{background:var(--brand-hover)}
.controls .group{display:inline-flex;box-shadow:inset 0 0 0 1px var(--border-primary);border-radius:8px;overflow:hidden}
.controls .group button{box-shadow:none;border-radius:0;border-right:1px solid var(--border-primary)}
.controls .group button:last-child{border-right:0}
.controls .group button[aria-pressed="true"]{background:var(--bg-secondary);color:var(--text-primary)}
.controls button:focus-visible,.controls input:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.controls input[type=range]{flex:1;min-width:120px;accent-color:var(--brand)}
.controls .t{color:var(--text-tertiary);min-width:44px;text-align:right}
/* Frame */
.viewport{position:relative;width:100%;overflow:hidden}
.frame{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--bg-page);display:grid}
.frame.land{width:1280px;height:720px;padding:20px 24px 14px;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;column-gap:20px;row-gap:8px}
.frame.port{width:480px;height:860px;padding:12px;grid-template-rows:1fr auto auto;row-gap:10px}
.embed,.embed body,.embed .frame{background:transparent}
.embed .page{margin:0;padding:0;max-width:none}
.embed .controls{display:none}
.fader{display:contents}
.note{grid-column:1 / -1;font-size:12px;color:var(--text-tertiary);text-align:left;transition:opacity .3s linear}
.port .note{font-size:11px;text-align:left}

/* Panels */
.slot{display:contents}
.port .slot{display:grid;position:relative;min-height:0}
.port .slot > .panel{grid-area:1 / 1;transition:opacity .35s linear}
.panel{background:var(--bg-primary);box-shadow:inset 0 0 0 1px var(--border-secondary);border-radius:12px;display:grid;grid-template-rows:auto 7fr 3fr;min-height:0;overflow:hidden;transition:opacity .35s linear}
.port .panel{grid-template-rows:auto 1fr}
.panel.dim{opacity:.4}
.port .panel.gone{opacity:0}
.phead{box-shadow:inset 0 -1px 0 var(--border-secondary)}
.land .phead{padding:16px 22px 14px}
.port .phead{padding:12px 16px 10px}
.ptitle{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:300;letter-spacing:-.02em;line-height:1}
.land .ptitle{font-size:28px}
.port .ptitle{font-size:22px}
.wordmark{height:.72em;width:auto;display:block}
.psub{display:block;font-size:13px;color:var(--text-tertiary);margin-top:7px;line-height:1.3}
.port .psub{font-size:11.5px;margin-top:5px}

/* Feed on a spine */
.work{position:relative;min-height:0;overflow:hidden}
.land .work{padding:14px 22px 0}
.port .work{padding:10px 16px 0}
.feed{display:flex;flex-direction:column;height:100%;overflow:hidden}
.row{position:relative;padding-left:32px;max-height:0;opacity:0;overflow:hidden;flex:none;transition:max-height .4s linear,opacity .3s linear}
.row.on{max-height:240px;opacity:1}
.row.on.past{opacity:.45}
.row::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--border-primary)}
.row.first::before{top:12px}
.row .av{position:absolute;left:0;width:22px;height:22px;border-radius:9999px;display:flex;align-items:center;justify-content:center;background:var(--bg-tertiary);color:var(--text-secondary);box-shadow:0 0 0 3px var(--bg-primary)}
.row .av svg{width:13px;height:13px}
.row .av.h svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row .av.a{background:var(--brand-soft);color:var(--brand)}
.row .av.a svg{width:14px;height:14px;fill:currentColor}
.row.now .av{box-shadow:0 0 0 3px var(--bg-primary),0 0 0 4px var(--border-primary)}
.row.bad .av{background:var(--lost-soft);color:var(--lost-text)}
.gap{height:26px;display:flex;align-items:center;font-size:12px;color:var(--text-tertiary)}
.row.hasgap::before{background:repeating-linear-gradient(to bottom,var(--border-primary) 0 4px,transparent 4px 8px)}
.rbody{display:grid;align-items:start;gap:14px;padding:4px 0 14px}
.land .rbody.withart{grid-template-columns:220px 1fr}
.port .rbody{gap:6px;padding:3px 0 10px}
.ts{font-size:12px;color:var(--text-tertiary);display:block;line-height:1.2}
.cap{display:block;font-weight:500;line-height:1.3;margin-top:2px}
.land .cap{font-size:16px}
.port .cap{font-size:14px}
.row.bad .cap{color:var(--lost-text)}

/* Evidence snippets: one big thing each */
.art{background:var(--bg-secondary);box-shadow:inset 0 0 0 1px var(--border-secondary);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.35;color:var(--text-secondary);min-width:0}
.port .art{padding:7px 10px;font-size:11.5px}
.art .big{display:block;font-size:20px;font-weight:500;color:var(--text-primary);letter-spacing:-.01em;line-height:1.2}
.port .art .big{font-size:16px}
.art .line{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.art mark{background:var(--disp-soft);color:var(--disp-text);padding:0 4px;border-radius:4px}
.art .strike{text-decoration:line-through;color:var(--text-tertiary);font-weight:400}
.split{display:flex;height:12px;border-radius:8px;overflow:hidden;margin:2px 0 8px;gap:2px}
.split div{height:100%}
.legend{display:flex;gap:4px 14px;font-size:12.5px;color:var(--text-tertiary);flex-wrap:wrap}
.port .legend{font-size:11px}
.legend b{color:var(--text-primary);font-weight:500}
.dotc{display:inline-block;width:7px;height:7px;border-radius:9999px;margin-right:5px;vertical-align:1px}
.idle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-tertiary);transition:opacity .3s linear}
.idle.off{opacity:0}

/* Metrics: three numbers */
.mets{display:grid;grid-template-columns:1.25fr 1fr 1fr;box-shadow:inset 0 1px 0 var(--border-primary);background:var(--bg-secondary);min-height:0}
.port .panel .mets{display:none}
.met{display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0;padding:0 22px;border-right:1px solid var(--border-secondary)}
.met:last-child{border-right:0}
.met .k{font-size:13px;color:var(--text-tertiary);line-height:1.2}
.val{position:relative;height:40px;display:flex;align-items:center}
.val .v{font-family:var(--font-display);font-weight:300;letter-spacing:-.02em;font-size:38px;line-height:1;white-space:nowrap;opacity:0;transition:opacity .25s linear}
.mxp .val .v{color:var(--good-text)}
.val.on .v{opacity:1}
.val .sk{position:absolute;left:0;top:50%;width:90px;height:12px;margin-top:-6px;border-radius:6px;background:var(--bg-quaternary)}
.val.on .sk{display:none}

/* Mobile: one comparison table under the single panel */
.ctable{display:none}
.port .ctable{display:grid;grid-template-columns:1.1fr 1fr 1fr;background:var(--bg-primary);box-shadow:inset 0 0 0 1px var(--border-secondary);border-radius:12px;padding:4px 16px}
.ctable > div{padding:9px 0;border-bottom:1px solid var(--border-secondary);min-width:0}
.ctable > div.l{border-bottom:0}
.ctable .h{font-family:var(--font-display);font-weight:300;font-size:16px;letter-spacing:-.02em;color:var(--text-primary);display:flex;align-items:center;gap:5px}
.ctable .h .wordmark{height:.72em}
.ctable .k{font-size:12px;color:var(--text-tertiary);align-self:center}
.ctable .val{height:28px}
.ctable .val .v{font-size:24px}
.ctable .val.m .v{color:var(--good-text)}
.ctable .val .sk{width:56px;height:9px;margin-top:-4px}

/* Pause control inside the frame (embed) */
.pz{position:absolute;right:10px;bottom:10px;width:30px;height:30px;border-radius:9999px;border:0;background:var(--bg-primary);color:var(--text-secondary);box-shadow:inset 0 0 0 1px var(--border-primary),0 1px 3px rgba(24,23,22,.05);display:none;align-items:center;justify-content:center;cursor:pointer;z-index:5;opacity:.8}
.embed .pz{display:flex}
.pz:hover{opacity:1}
.pz:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.pz svg{width:12px;height:12px;fill:currentColor}
</style>
</head>

<script>
// All copy and numbers live here. Edit and reload.
// Captions follow ASD-STE100: present tense, active voice, one action per sentence.
const B = (tone, icon, text) => `<span class="badge pill noDot tone-${tone}"><svg class="i"><use href="#i-${icon}"/></svg><span>${text}</span></span>`;
const CONFIG = {
  today: [
    {ts:"Day 1",  actor:"h", mins:20,  cap:"Adds the short-pay to a queue of 214."},
    {ts:"Day 4",  actor:"h", mins:140, gap:"3 days later", cap:"Requests backup from the retailer and the carrier."},
    {ts:"Day 7",  actor:"h", mins:70,  gap:"3 days later", cap:"Waits for the carrier receipt."},
    {ts:"Day 9",  actor:"h", mins:40,  gap:"2 days later", cap:"Misses the dispute deadline.", bad:true},
    {ts:"Day 10", actor:"h", mins:90,  gap:"1 day later",  cap:"Disputes $14,000. Writes off $46,000.", split:"today"}
  ],
  maxima: [
    {ts:"8 s", secs:8, cap:"Reads 3 debit memos. Finds 17 claims.", art:`
      <span class="big">17 claims</span>
      <div class="line"><span>3 memos, $100,000.00 total</span>${B("success","check","Ties to the cent")}</div>`},

    {ts:"1 min 15 s", secs:75, cap:"Proves on-time delivery. Disputes $24,000.", art:`
      <div class="line"><span>PO 7718, must arrive by</span></div>
      <div class="line"><span class="big"><span class="strike">Sep 29</span> Oct 3</span>${B("success","check","Delivered Oct 2")}</div>`},
    {ts:"1 min 52 s", secs:112, cap:"Proves the 3PL shipped short. Bills the 3PL $10,000.", art:`
      <div class="line"><span>Ordered 410 cartons, 3PL packed 358</span></div>
      <div class="line"><span class="big">52 cartons short</span>${B("success","check","Carrier receipt clean")}</div>`},
    {ts:"2 min 40 s", secs:160, cap:"Decides all 17 claims.", split:"maxima"},
    {ts:"3 min 36 s", secs:216, cap:"Prepares 3 dispute packets.", art:`
      <div class="line"><span class="big">3 packets ready</span>${B("success","check","Evidence attached")}</div>`},
    {ts:"15 min review", actor:"h", mins:15, cap:"Approves the packets. They file 8 days early.", art:`
      <div class="line"><span class="big">3 packets filed</span>${B("dispute","check","8 days early")}</div>`}
  ],
  splits: {
    maxima: [
      {label:"Dispute", amt:44000, color:"var(--disp)"},
      {label:"Recover from 3PL", amt:16000, color:"var(--good)"},
      {label:"Valid", amt:40000, color:"var(--acc)"}],
    today: [
      {label:"Disputed", amt:14000, color:"var(--disp)"},
      {label:"Written off", amt:46000, color:"var(--lost)"},
      {label:"Valid", amt:40000, color:"var(--acc)"}]
  },
  costMaxima: "60% lower",   // cost vs. today's baseline
  // 30-day model (not shown at the moment)
  month: {
    cases: 1000,              // deductions opened a month (shown in the footnote)
    openValue: 2000000,       // their total value
    recoverable: 0.10,        // share of that value that is invalid and recoverable
    todayCoverage: 0.10,      // share of value the team works today
    analystRate: 41.67,       // loaded cost per analyst hour ($250 for a 6-hour case)
    agentCostPerCase: 12.50   // Maxima cost per case
  }
};

// Timeline (seconds): Act 1 your team, Act 2 Maxima, then hold
const STEP = 1.8;
const A1_0 = 0.4, A1_END = A1_0 + 4 * STEP + 0.6;
const S1 = A1_END + 0.2;
const A2_0 = S1 + 3.1, A2_END = A2_0 + 6 * STEP + 0.6;
const S2 = A2_END + 0.2;
const FADE0 = 28.5, T = 29.5;

const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(Math.max(x, a), b);
const fmtUSD = n => "$" + Number(n).toLocaleString("en-US", {minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2});
const fmtHM = m => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h} h ${r} min` : `${h} h`) : `${r} min`; };
const fmtMS = s => { s = Math.round(s); const m = Math.floor(s / 60), r = s % 60; return m ? (r ? `${m} min ${r} s` : `${m} min`) : `${r} s`; };

const M = CONFIG.month;
const DASH = "\u2013";
const METRICS = [
  {k:"Human time"},
  {k:"Agent time"},
  {k:"Cost"}
];

function splitArt(key) {
  const s = CONFIG.splits[key], total = s.reduce((a, x) => a + x.amt, 0);
  return `<div class="split">${s.map(x => `<div style="width:${x.amt / total * 100}%;background:${x.color}"></div>`).join("")}</div>
    <div class="legend">${s.map(x => `<span><i class="dotc" style="background:${x.color}"></i>${x.label} <b>${fmtUSD(x.amt)}</b></span>`).join("")}</div>`;
}
function makeRow(c, parent, i) {
  const el = document.createElement("div");
  const art = c.split ? splitArt(c.split) : c.art;
  el.className = "row" + (i === 0 ? " first" : "") + (c.bad ? " bad" : "") + (c.gap ? " hasgap" : "");
  el.innerHTML = `${c.gap ? `<div class="gap">${c.gap}</div>` : ""}
    <span class="av ${c.actor === "h" ? "h" : "a"}" style="top:${c.gap ? 28 : 2}px" role="img" aria-label="${c.actor === "h" ? "Person" : "Maxima agent"}"><svg><use href="#i-${c.actor === "h" ? "user" : "mark"}"/></svg></span>
    <div class="rbody${art ? " withart" : ""}"><div><span class="ts">${c.ts}</span><span class="cap">${c.cap}</span></div>${art ? `<div class="art">${art}</div>` : ""}</div>`;
  parent.appendChild(el);
  return el;
}
const tRows = CONFIG.today.map((c, i) => ({el: makeRow(c, $("feedT"), i), at: A1_0 + i * STEP, c}));
const mRows = CONFIG.maxima.map((c, i) => ({el: makeRow(c, $("feedM"), i), at: A2_0 + i * STEP, c}));

// Metric bands (desktop) and comparison table (mobile)
const metHTML = side => METRICS.map((x, i) => `<div class="met"><span class="k">${x.k}</span><div class="val" data-side="${side}" data-i="${i}"><span class="sk"></span><span class="v"></span></div></div>`).join("");
$("tMets").innerHTML = metHTML("t");
$("mMets").innerHTML = metHTML("m");
(function () {
  const wm = document.getElementById("wm").innerHTML;
  let h = `<div></div><div class="h">Manually</div><div class="h">Maxima's agents</div>`;
  METRICS.forEach((x, i) => {
    const l = i === METRICS.length - 1 ? " l" : "";
    h += `<div class="k${l}">${x.k}</div><div class="${l.trim()}"><div class="val t" data-side="t" data-i="${i}"><span class="sk"></span><span class="v"></span></div></div>
      <div class="${l.trim()}"><div class="val m" data-side="m" data-i="${i}"><span class="sk"></span><span class="v"></span></div></div>`;
  });
  $("ctable").innerHTML = h;
})();
const vals = [...document.querySelectorAll(".val[data-side]")];

function showFeed(rows, t, keep, settled) {
  const n = rows.filter(r => t >= r.at).length;
  rows.forEach((r, i) => {
    r.el.classList.toggle("on", t >= r.at && i >= n - keep);
    r.el.classList.toggle("now", i === n - 1 && !settled);
    r.el.classList.toggle("past", i < n - 1 && !settled);
  });
}
// Running effort by actor, climbing to each row's total as it lands
function effort(rows, t, actor) {
  let total = 0;
  for (const r of rows) {
    if (t < r.at) break;
    const isH = r.c.actor === "h";
    if ((actor === "h") !== isH) continue;
    const target = isH ? total + r.c.mins : r.c.secs;
    total = total + (target - total) * clamp((t - r.at) / 0.8);
  }
  return total;
}

function render(t) {
  const fade = t < 0.3 ? t / 0.3 : t > FADE0 ? 1 - clamp((t - FADE0) / (T - FADE0)) : 1;
  $("frame").style.opacity = fade;
  const port = $("frame").classList.contains("port");
  const act2 = t >= A2_0 - 0.5;

  $("pT").classList.toggle("dim", !port && act2 && t < S2);
  $("pM").classList.toggle("dim", !port && !act2);
  $("pT").classList.toggle("gone", port && act2);
  $("pM").classList.toggle("gone", port && !act2);
  $("mIdle").classList.toggle("off", act2);
  showFeed(tRows, t, 4, t >= S1);
  showFeed(mRows, t, 4, t >= S2);

  const tHuman = effort(tRows, t, "h"), mAgent = effort(mRows, t, "a"), mHuman = effort(mRows, t, "h");
  vals.forEach(v => {
    const side = v.dataset.side, i = +v.dataset.i;
    let on = false, text = "";
    if (side === "t") {
      if (i === 0) { on = t >= A1_0; text = fmtHM(tHuman); }
      if (i === 1) { on = t >= A1_0; text = DASH; }
      if (i === 2) { on = t >= S1; text = "Baseline"; }
    } else {
      if (i === 0) { on = t >= A2_0; text = mHuman > 0.5 ? fmtHM(mHuman) : DASH; }
      if (i === 1) { on = t >= A2_0; text = fmtMS(mAgent); }
      if (i === 2) { on = t >= S2; text = CONFIG.costMaxima; }
    }
    const el = v.querySelector(".v");
    if (el.textContent !== text) el.textContent = text;
    v.classList.toggle("on", on);
  });

  $("scrub").value = t;
  $("tlabel").textContent = t.toFixed(1) + "s";
}

// Frame sizing: 16:9 side by side; on phones one panel at a time
const params = new URLSearchParams(location.search);
const EMBED = !!params.get("embed");
let forced = params.get("mode");
function layout() {
  const vp = $("viewport"), fr = $("frame");
  const par = vp.parentElement, cs = getComputedStyle(par);
  const avail = par.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const mode = forced || (avail < 640 ? "port" : "land");
  fr.className = "frame " + mode;
  const W = mode === "land" ? 1280 : 480, H = mode === "land" ? 720 : 860;
  const width = mode === "port" ? Math.min(avail, 480) : avail;
  const s = width / W;
  fr.style.transform = `scale(${s})`;
  vp.style.width = width + "px";
  vp.style.height = H * s + "px";
  $("modeBtn").setAttribute("aria-pressed", String(mode === "port"));
  $("modeBtn").textContent = mode === "port" ? "Show desktop" : "Show mobile";
}
window.addEventListener("resize", () => { layout(); render(t); });
$("modeBtn").onclick = () => { forced = $("frame").classList.contains("port") ? "land" : "port"; layout(); render(t); };

// Playback
let t = 0, playing = !EMBED, speed = 1, last = null, userPaused = false;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (params.has("t")) { t = parseFloat(params.get("t")) || 0; playing = false; }
if (reduced && !params.has("t")) { t = S2 + 2; playing = false; }
function setPlaying(p) {
  playing = p; last = null;
  $("play").textContent = p ? "Pause" : "Play";
